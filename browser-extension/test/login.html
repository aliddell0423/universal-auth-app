<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Auth Test Login</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 4rem auto;
      padding: 1rem;
    }
    input, button {
      display: block;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Universal Auth Test Login</h1>
  <p>Focus the password field to trigger a Pixel approval request.</p>
  <form action="#" method="post">
    <input type="email" name="username" placeholder="Email" autocomplete="username">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Login</button>
  </form>
</body>
</html>
