<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Universal Auth</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
  header { padding: 10px 14px; background: #f6f8fa; border-bottom: 1px solid #d0d7de; }
  header b { font-size: 14px; }
  header div { color: #59636e; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  section { padding: 10px 14px; border-bottom: 1px solid #eaeef2; }
  h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #59636e; }
  .login { padding: 6px 0; }
  .login + .login { border-top: 1px solid #f0f2f4; }
  .who { display: flex; align-items: baseline; gap: 6px; }
  .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who span { color: #59636e; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; color: #59636e; border: 1px solid #d0d7de; border-radius: 10px; padding: 0 6px; flex: none; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  button { border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #eef1f4; }
  button.p { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.danger { color: #cf222e; }
  button.link { border: 0; background: none; color: #0969da; padding: 0; }
  form { display: grid; grid-template-columns: 84px 1fr; gap: 6px 8px; align-items: center; margin-top: 6px; }
  form .full { grid-column: 1 / -1; }
  input, select { width: 100%; border: 1px solid #d0d7de; border-radius: 6px; padding: 4px 6px; font: inherit; }
  input[type=checkbox] { width: auto; }
  .pwrow { display: flex; gap: 4px; }
  .pwrow input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: #59636e; font-size: 12px; }
  .msg { font-size: 12px; margin-top: 6px; }
  .err { color: #cf222e; }
  .ok { color: #1a7f37; }
  .wait { color: #9a6700; }
  [hidden] { display: none !important; }
  #search-results { max-height: 160px; overflow: auto; margin-top: 6px; }
  #search-results .login { cursor: pointer; }
  #search-results .login:hover { background: #eef4ff; }
</style>
</head>
<body>
  <header><b>Universal Auth</b><div id="site">—</div></header>

  <section id="logins-sec">
    <h2>Saved logins for this site</h2>
    <div id="logins"><div class="muted">Loading…</div></div>
    <div id="global-msg" class="msg"></div>
  </section>

  <section id="add-sec">
    <button class="link" id="add-toggle">+ Add a login for this site</button>
    <form id="add-form" hidden>
      <label>Username</label><input name="username" autocomplete="off">
      <label>Password</label><div class="pwrow"><input name="password" type="text" autocomplete="off" spellcheck="false"><button type="button" data-gen title="Generate">⚄</button></div>
      <label>Account</label><input name="account" placeholder="defaults to username">
      <label>Use on</label><select name="save_as"></select>
      <div class="full btns"><button class="p" type="submit">Save</button><button type="button" data-cancel>Cancel</button></div>
      <div class="full msg"></div>
    </form>
  </section>

  <section id="link-sec">
    <button class="link" id="link-toggle">Use a login saved for another site here…</button>
    <div id="link-box" hidden>
      <input id="search" placeholder="Search saved logins (e.g. utexas)">
      <div id="search-results"></div>
      <div class="muted">Linking is stored on this computer only.</div>
    </div>
  </section>

  <section id="gen-sec">
    <h2>Password generator</h2>
    <div class="pwrow"><input id="gen-out" readonly><button id="gen-copy" title="Copy">Copy</button><button id="gen-again" title="Another">↻</button></div>
    <form id="gen-form">
      <label>Length</label><input name="length" type="number" min="4" max="128">
      <label>Symbols</label><label class="muted"><input name="symbols" type="checkbox"> include symbols</label>
      <label>Only these</label><input name="symbolSet" placeholder="!@#$%^&*-_=+.?">
      <div class="full muted" id="gen-desc"></div>
      <div class="full btns"><button type="button" id="gen-save">Remember for this site</button><button type="button" id="gen-reset" class="link">Reset</button></div>
    </form>
  </section>

  <script src="passgen.js"></script>
  <script src="popup.js"></script>
</body>
</html>
